<script>// Shared helpers + style registry for the style-frame explorations.
// Every style is a pure function of time: draw(ctx, W, H, t). Same t => same pixels.
(function () {
  const STYLES = (window.STYLES = window.STYLES || []);
  window.registerStyle = (s) => STYLES.push(s);

  const H = (window.H = {});

  // ---------- seeded randomness ----------
  // H.rng(seed) -> r() in [0,1). Extras: r.range(a,b), r.int(a,b), r.pick(arr), r.gauss(), r.chance(p)
  H.rng = function (seed = 1) {
    let a = typeof seed === 'string' ? hashStr(seed) : (seed >>> 0) || 1;
    const r = function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (lo, hi) => lo + r() * (hi - lo);
    r.int = (lo, hi) => Math.floor(lo + r() * (hi - lo + 1));
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.chance = (p) => r() < p;
    r.gauss = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    return r;
  };
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  // ---------- gradient noise ----------
  // H.makeNoise(seed) -> { n2(x,y), n3(x,y,z), fbm2(x,y,oct), fbm3(x,y,z,oct) }  (outputs roughly -1..1)
  H.makeNoise = function (seed = 1) {
    const r = H.rng(seed), p = new Uint8Array(512), perm = [...Array(256).keys()];
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    const lerp = (a, b, t) => a + (b - a) * t;
    const g3 = (h, x, y, z) => { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); };
    function n3(x, y, z) {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      const u = fade(x), v = fade(y), w = fade(z);
      const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
      return lerp(lerp(lerp(g3(p[AA], x, y, z), g3(p[BA], x - 1, y, z), u), lerp(g3(p[AB], x, y - 1, z), g3(p[BB], x - 1, y - 1, z), u), v),
        lerp(lerp(g3(p[AA + 1], x, y, z - 1), g3(p[BA + 1], x - 1, y, z - 1), u), lerp(g3(p[AB + 1], x, y - 1, z - 1), g3(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);
    }
    const n2 = (x, y) => n3(x, y, 0.5);
    const fbm3 = (x, y, z, oct = 4) => { let s = 0, a = 0.5, f = 1, norm = 0; for (let i = 0; i < oct; i++) { s += a * n3(x * f, y * f, z * f); norm += a; a *= 0.5; f *= 2; } return s / norm; };
    const fbm2 = (x, y, oct = 4) => fbm3(x, y, 0.5, oct);
    return { n2, n3, fbm2, fbm3 };
  };

  // ---------- math ----------
  H.lerp = (a, b, t) => a + (b - a) * t;
  H.clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));

      const s = 1 + v * strength * 2;

  H.vignette = function (ctx, W, Hh, strength = 0.5, color = '0,0,0') {
    const g = ctx.createRadialGradient(W / 2, Hh / 2, Math.min(W, Hh) * 0.3, W / 2, Hh / 2, Math.hypot(W, Hh) * 0.6);
    g.addColorStop(0, `rgba(${color},0)`); g.addColorStop(1, `rgba(${color},${strength})`);

  // ---------- rendering entry ----------
  // Renders style into canvas at logical 1280x720 (canvas can be any pixel size; it is scaled).
  H.W = 1280; H.H = 720;

  };

})();

<script>// sound.js: a small synthesized sound kit for the style explainers. Plain Web Audio, no audio files.
// Voiceover mode: SOUND.kit(ctx, { voiceover: true }) drops beds and music, plays anything marked minor
// (play(..., { minor: true }), tone/noise { minor: true }, or scheduled inside k.withMinor(() => ...)) at about 60%
// volume instead of full, and sits all effects a little lower, so the narration stays on top while the piece still
// sounds alive. In the full mix, minor sounds play at full volume. Scores can read k.vo to branch further.
// A style adds   explainerSound(k) { k.bed('room', 0, D); k.play('pop', 1.25); ... }   and the same
// call schedules into a live AudioContext (the player) or an OfflineAudioContext (the video render).
// Times are seconds on the explainer's own clock. Randomness is seeded, so every render is identical.
(function () {
  'use strict';
  const SOUND = (window.SOUND = {});
  const TINY = 1e-4;

  // seeded random in [0,1), keyed by any string
  function rand(key) {
    let h = 2166136261;
    for (let i = 0; i < key.length; i++) { h ^= key.charCodeAt(i); h = Math.imul(h, 16777619); }
    let a = h >>> 0 || 1;
    return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // note names to Hz: 'A4' = 440, 'C#5', 'Eb3'
  const STEP = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function hz(n) {
    if (typeof n === 'number') return n;
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(n);
    const semis = STEP[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (Number(m[3]) - 4) * 12 - 9;
    return 440 * Math.pow(2, semis / 12);
  }
  SOUND.hz = hz;

  SOUND.kit = function (ctx, opts) {
    const o = opts || {};
    const VO = !!o.voiceover;
    const MINOR = 0.6; // voiceover-mode volume for minor sounds
    let inMinor = false;
    const gainOf = (p, d) => (p.gain == null ? d : p.gain) * (VO && (p.minor || inMinor) ? MINOR : 1);
    const T0 = (o.start || 0) - 0; // explainer time that maps to ctx time `base`
    const base = ctx.currentTime + (o.delay || 0);

    // spike to about twice its set level.
    const SR = ctx.sampleRate;
    const at = (t) => (Math.round((base + (t - T0)) * SR) + 0.25) / SR;

    // ---- buses: sfx, amb, music -> compressor -> master; one shared reverb send

    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.18;
    comp.connect(master); master.connect(o.dest || ctx.destination);
    const bus = {};
    for (const [name, g] of Object.entries({ sfx: VO ? 0.7 : 0.85, amb: 0.5, music: 0.45 })) { bus[name] = ctx.createGain(); bus[name].gain.value = g; bus[name].connect(comp); }

    // generated room reverb: decaying stereo noise, darker toward the tail
    const verb = ctx.createConvolver();
    {
      const secs = 1.6, n = Math.floor(secs * ctx.sampleRate), ir = ctx.createBuffer(2, n, ctx.sampleRate);
      for (let c = 0; c < 2; c++) {
        const r = rand('verb' + c), d = ir.getChannelData(c); let lp = 0;

      }

    }

    // seeded noise buffers: white, pink-ish and brown
    const noiseBuf = {};

      const n = Math.floor(2.5 * ctx.sampleRate);
      for (const kind of ['white', 'pink', 'brown']) {
        const b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0), r = rand('noise-' + kind);
        let p0 = 0, p1 = 0, p2 = 0, br = 0;

          const w = r() * 2 - 1;
          if (kind === 'white') d[i] = w;

    // ---- automation helpers
    // a value or [[dt, value], ...] from the voice start; ramps are exponential (frequencies)

    // noise(t, { dur, color, filter, f, q, gain, a, hold, pan, verb, bus, rate })
    function noise(time, p) {
      const t = at(time), dur = p.dur || 0.2;

      pop: (t, o) => { tone(t, { f: [[0, o.f || 620], [0.07, (o.f || 620) * 0.45]], dur: 0.1, gain: 0.32 * o.g, pan: o.pan }); noise(t, { dur: 0.012, filter: 'highpass', f: 3000, gain: 0.12 * o.g, pan: o.pan }); },
      tick: (t, o) => noise(t, { dur: 0.018, filter: 'bandpass', f: o.f || 4200, q: 2.5, gain: 0.3 * o.g, pan: o.pan }),
      click: (t, o) => { tone(t, { f: o.f || 1900, type: 'square', dur: 0.02, gain: 0.08 * o.g, filter: 'lowpass', f2: 3000, pan: o.pan }); noise(t, { dur: 0.01, filter: 'highpass', f: 2500, gain: 0.15 * o.g, pan: o.pan }); },
      tock: (t, o) => { tone(t, { f: o.f || 820, dur: 0.07, gain: 0.25 * o.g, pan: o.pan }); noise(t, { dur: 0.05, filter: 'bandpass', f: o.f || 820, q: 9, gain: 0.35 * o.g, pan: o.pan }); },
      blip: (t, o) => tone(t, { f: o.f || 'E6', type: o.type || 'square', dur: o.dur || 0.07, gain: 0.07 * o.g, a: 0.002, hold: (o.dur || 0.07) * 0.6, pan: o.pan }),
      whoosh: (t, o) => { const d = o.dur || 0.45; noise(t, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 350], [d * 0.55, o.top || 2600], [d, 700]], q: 0.9, gain: 0.32 * o.g, a: d * 0.5, pan: o.pan, verb: 0.15 }); },
      swish: (t, o) => { const d = o.dur || 0.18; noise(t, { dur: d, filter: 'highpass', f: [[0, 1800], [d, 5200]], q: 0.7, gain: 0.22 * o.g, a: d * 0.35, pan: o.pan }); },
      riser: (t, o) => { const d = o.dur || 0.8; noise(t, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 300], [d, 4000]], q: 1.2, gain: 0.25 * o.g, a: d * 0.95, pan: o.pan, verb: 0.2 }); tone(t, { f: [[0, 180], [d, 720]], type: 'triangle', dur: d, gain: 0.06 * o.g, a: d * 0.9 }); },
      thud: (t, o) => { tone(t, { f: [[0, o.f || 130], [0.16, 42]], dur: 0.26, gain: 0.55 * o.g, pan: o.pan }); noise(t, { dur: 0.09, color: 'brown', filter: 'lowpass', f: 500, gain: 0.35 * o.g, pan: o.pan }); },
      impact: (t, o) => { S.thud(t, o); noise(t, { dur: 0.7, color: 'pink', filter: 'lowpass', f: [[0, 2400], [0.6, 300]], gain: 0.3 * o.g, verb: 0.35, pan: o.pan }); },
      stamp: (t, o) => { S.thud(t, { ...o, f: 160 }); noise(t, { dur: 0.05, filter: 'bandpass', f: 1300, q: 1.2, gain: 0.4 * o.g, pan: o.pan }); noise(t + 0.004, { dur: 0.012, filter: 'highpass', f: 3500, gain: 0.25 * o.g, pan: o.pan }); },

      glitch: (t, o) => { const r = rand('glitch' + t); for (let i = 0; i < 7; i++) tone(t + i * 0.022, { f: 200 + r() * 1800, type: 'square', dur: 0.02, gain: 0.07 * o.g, a: 0.001, hold: 0.015, pan: r() * 1.4 - 0.7 }); noise(t, { dur: 0.16, filter: 'bandpass', f: 2500, q: 0.6, gain: 0.12 * o.g }); },

      count: (t, o) => S.tick(t, { ...o, f: o.f || 5200, g: o.g * 0.7 }),

          chalk: { f: 1700, q: 0.6, g: 0.22, grain: 0.028 },
          pencil: { f: 4600, q: 0.8, g: 0.16, grain: 0.04, filter: 'highpass' },
          pen: { f: 4200, q: 1.6, g: 0.08, grain: 0.06 },
          brush: { f: 900, q: 0.5, g: 0.1, grain: 0.09, color: 'pink' },
          sharpie: { f: 2400, q: 1.4, g: 0.2, grain: 0.045 },

      // paper: picking up / slapping down / turning a sheet

      slap: (t, o) => { noise(t, { dur: 0.07, filter: 'highpass', f: 900, gain: 0.45 * o.g, a: 0.001, pan: o.pan }); tone(t, { f: [[0, 180], [0.06, 70]], dur: 0.1, gain: 0.25 * o.g, pan: o.pan }); },
      tape: (t, o) => { noise(t, { dur: o.dur || 0.5, filter: 'bandpass', f: [[0, 900], [o.dur || 0.5, 2200]], q: 1.8, gain: 0.18 * o.g, a: 0.02, pan: o.pan }); },
      press: (t, o) => { S.thud(t, { ...o, f: 95, g: o.g * 0.9 }); noise(t + 0.01, { dur: 0.25, color: 'brown', filter: 'lowpass', f: 700, gain: 0.25 * o.g, pan: o.pan }); },
      roller: (t, o) => { const d = o.dur || 0.6; noise(t, { dur: d, color: 'brown', filter: 'bandpass', f: 380, q: 1.5, gain: 0.3 * o.g, a: 0.05, hold: d * 0.6, pan: o.pan }); for (let x = 0; x < d; x += 0.07) S.tock(t + x, { f: 300, g: o.g * 0.15, pan: o.pan }); },
      erase: (t, o) => { const d = o.dur || 0.6, r = rand('erase' + t); for (let x = 0; x < d; x += 0.06 + r() * 0.04) noise(t + x, { dur: 0.08, color: 'pink', filter: 'bandpass', f: 700 + r() * 500, q: 0.8, gain: 0.22 * o.g, a: 0.03, pan: (r() - 0.5) * 0.5 }); },

      // machines and screens

      // chip (8-bit console) sounds: raw square/triangle, no filtering
      coin: (t, o) => { tone(t, { f: 'B5', type: 'square', dur: 0.07, gain: 0.07 * o.g, a: 0.001, hold: 0.06 }); tone(t + 0.07, { f: 'E6', type: 'square', dur: 0.3, gain: 0.07 * o.g, a: 0.001, hold: 0.1 }); },
      jump: (t, o) => tone(t, { f: [[0, 260], [0.16, 820]], type: 'square', dur: 0.18, gain: 0.07 * o.g, a: 0.001, hold: 0.12 }),
      hurt: (t, o) => { tone(t, { f: [[0, 600], [0.25, 90]], type: 'square', dur: 0.28, gain: 0.08 * o.g, a: 0.001, hold: 0.2 }); noise(t, { dur: 0.2, filter: 'lowpass', f: 1800, gain: 0.15 * o.g, rate: 0.25 }); },
      powerup: (t, o) => ['C5', 'E5', 'G5', 'C6', 'E6', 'G6', 'C7'].forEach((n, i) => tone(t + i * 0.045, { f: n, type: 'square', dur: 0.06, gain: 0.06 * o.g, a: 0.001, hold: 0.05 })),
      select: (t, o) => { S.blip(t, { ...o, f: 'A5', dur: 0.04 }); S.blip(t + 0.05, { ...o, f: 'E6', dur: 0.05 }); },
      text: (t, o) => { const n = o.n || 10, rate = o.rate || 0.05; for (let i = 0; i < n; i++) tone(t + i * rate, { f: i % 2 ? 'C6' : 'G5', type: 'square', dur: 0.025, gain: 0.04 * o.g, a: 0.001, hold: 0.015 }); },
    };

    function play(name, t, opts) {
      const fn = S[name];
      if (!fn) throw new Error('unknown sound: ' + name);
      const o2 = Object.assign({}, opts); o2.g = o2.gain == null ? 1 : o2.gain;
      if (opts && opts.minor) withMinor(() => fn(t, o2)); else fn(t, o2);
    }

    // everything scheduled inside fn counts as minor (quieter in voiceover mode)
    function withMinor(fn) { const was = inMinor; inMinor = true; try { fn(); } finally { inMinor = was; } }

    // ---- beds: continuous sound under a stretch of time. bed(name, t0, t1, opts)
    function bed(name, t0, t1, p) {
      if (VO) return;
      p = p || {}; const g = p.gain == null ? 1 : p.gain, d = t1 - t0, fade = Math.min(0.4, d / 4);
      const long = (q) => Object.assign({ dur: d, a: fade, hold: d - fade * 2, bus: 'amb' }, q);
      if (name === 'room') noise(t0, long({ color: 'brown', filter: 'lowpass', f: 320, gain: 0.12 * g }));
      else if (name === 'hiss') noise(t0, long({ color: 'pink', filter: 'highpass', f: 5000, gain: 0.02 * g }));
      else if (name === 'hum') { tone(t0, long({ f: 60, gain: 0.05 * g })); tone(t0, long({ f: 120, gain: 0.025 * g })); tone(t0, long({ f: 180, type: 'triangle', gain: 0.012 * g })); }
      else if (name === 'rain') { noise(t0, long({ color: 'pink', filter: 'bandpass', f: 2500, q: 0.4, gain: 0.08 * g })); const r = rand('rain'); for (let x = 0; x < d; x += 0.04 + r() * 0.08) noise(t0 + x, { dur: 0.01, filter: 'highpass', f: 4000, gain: 0.04 * g * r(), bus: 'amb', pan: r() * 1.6 - 0.8 }); }
      else if (name === 'projector') { noise(t0, long({ color: 'pink', filter: 'highpass', f: 3000, gain: 0.03 * g })); for (let x = 0; x < d; x += 1 / 24) S.tock(t0 + x, { f: 700, g: 0.04 * g, pan: 0.3 }); }
      else if (name === 'vinyl') { noise(t0, long({ color: 'pink', filter: 'bandpass', f: 1500, q: 0.5, gain: 0.025 * g })); const r = rand('vinyl'); for (let x = 0; x < d; x += 0.08 + r() * 0.4) noise(t0 + x, { dur: 0.006, filter: 'highpass', f: 2500, gain: 0.08 * g * r(), bus: 'amb' }); }
      else throw new Error('unknown bed: ' + name);
    }

    // ---- music: optional light beds that sit under the effects. music(name, t0, t1, { bpm, chords, gain })
    // chords: list of note arrays, one per bar, cycled. e.g. [['C4','E4','G4','B4'], ['A3','C4','E4','G4']]
    function music(name, t0, t1, p) {
      if (VO) return;
      p = p || {}; const g = p.gain == null ? 1 : p.gain, bpm = p.bpm || 100, beat = 60 / bpm, bar = beat * 4;
      const chords = p.chords || [['C4', 'E4', 'G4', 'B4'], ['A3', 'C4', 'E4', 'G4'], ['F3', 'A3', 'C4', 'E4'], ['G3', 'B3', 'D4', 'F4']];

        if (name === 'pad' || name === 'pulse') ch.forEach((n, k) => { tone(t, { f: n, type: 'triangle', dur: len + 0.3, gain: 0.035 * g, a: 0.25, hold: len - 0.3, bus: 'music', filter: 'lowpass', f2: 1400, pan: (k - 1.5) * 0.25, verb: 0.25 }); tone(t, { f: hz(n) * 1.004, type: 'sine', dur: len + 0.3, gain: 0.03 * g, a: 0.3, hold: len - 0.3, bus: 'music' }); });
        if (name === 'pulse') for (let b = 0; b < 4 && t + b * beat < t1 - 0.05; b++) {
          const tb = t + b * beat;
          tone(tb, { f: [[0, 110], [0.1, 50]], dur: 0.18, gain: (b % 2 ? 0.16 : 0.26) * g, bus: 'music' });
          noise(tb + beat / 2, { dur: 0.04, filter: 'highpass', f: 7000, gain: 0.05 * g, bus: 'music' });
          tone(tb + beat / 2, { f: hz(ch[0]) / 2, type: 'triangle', dur: beat * 0.45, gain: 0.08 * g, bus: 'music' });
        }
        if (name === 'chip') for (let s = 0; s < 8 && t + s * beat / 2 < t1 - 0.05; s++) {
          const ts = t + s * beat / 2;
          tone(ts, { f: hz(ch[0]) / 2, type: 'triangle', dur: beat * 0.45, gain: 0.12 * g, a: 0.001, hold: beat * 0.35, bus: 'music' });
          tone(ts, { f: ch[[0, 1, 2, 3, 2, 1, 2, 3][s]], type: 'square', dur: beat * 0.4, gain: 0.03 * g, a: 0.001, hold: beat * 0.25, bus: 'music' });
        }
      }
    }

    return { play, bed, music, tone, noise, withMinor, hz, vo: VO, sounds: Object.keys(S) };
  };

  // Live playback for a player: SOUND.live(scoreFn, fromT, { voiceover, master }) starts the score from explainer time
  // fromT right now and returns stop(). Call stop() on pause or seek, and SOUND.live again on play.
  SOUND.live = function (fn, fromT, opts) {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    fn(SOUND.kit(ctx, Object.assign({}, opts, { start: fromT || 0, delay: 0.03 })));
    return () => { try { ctx.close(); } catch (e) {} };
  };

  // Render a style's explainerSound into an OfflineAudioContext; returns interleaved float stereo.
  SOUND.renderOffline = async function (fn, duration, sampleRate, kitOpts) {
    const sr = sampleRate || 48000, len = Math.ceil(duration * sr);
    const ctx = new OfflineAudioContext(2, len, sr);
    fn(SOUND.kit(ctx, kitOpts || {}));
    const buf = await ctx.startRendering();
    const L = buf.getChannelData(0), R = buf.getChannelData(1), inter = new Float32Array(len * 2);
    let peak = 0;
    for (let i = 0; i < len; i++) { inter[2 * i] = L[i]; inter[2 * i + 1] = R[i]; peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i])); }
    return { inter, peak, frames: len, sr };
  };
})();

    MASKS.forEach((m, i) => { const a = lit[i] || 0; if (a <= 0) return; ctx.globalAlpha = a * 0.42; ctx.drawImage(A['m_' + m], r.x, r.y, r.dw, r.dh); ctx.globalAlpha = a * 0.28; ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(A['g_' + m], r.x, r.y, r.dw, r.dh); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; });
    const P = (nx, ny) => [r.x + nx * r.dw, r.y + ny * r.dh];
    labels.forEach(([s, nx, ny, a, size]) => { if (a <= 0) return; const [x, y] = P(nx, ny); ctx.save(); ctx.globalAlpha = a; shadowed(ctx, () => txt(ctx, s, `400 ${size || 52}px "Anton"`, x, y, 'center', 3), 18, 0.9); ctx.restore(); });
    return P;
  };
  const EMP_LABELS = [['RUSSIA', 0.74, 0.33], ['GERMANY', 0.425, 0.49], ['AUSTRIA-HUNGARY', 0.515, 0.585], ['OTTOMAN EMPIRE', 0.79, 0.745]];
  const EMP_T = [wt(17), wt(17) + 0.12, wt(17) + 0.24, wt(17) + 0.36];

  const rewindFX = (ctx, s, t) => {
    // the tape runs backwards: last shots replay in reverse with tracking noise
    const u = seg(t, s.t0, s.t1), seq = ['car', 'arrest', 'illus'], k = Math.min(2, Math.floor(u * 3)), uu = u * 3 - k;
    const img = A[seq[k]];
    const z = 1.25 - uu * 0.25 + 0.04 * Math.sin(t * 60);
    cover(ctx, img, 0.55 + 0.03 * Math.sin(t * 37), 0.5, z);
    const r = H.rng(Math.floor(t * 30) + 77);
    // horizontal tracking tears
    for (let i = 0; i < 7; i++) { const y = r.range(0, HH), h = r.range(8, 70), dx = r.range(-60, 60); ctx.drawImage(ctx.canvas, 0, y, W, h, dx, y, W, h); }
    ctx.fillStyle = 'rgba(255,255,255,0.10)'; for (let i = 0; i < 26; i++) ctx.fillRect(0, r.range(0, HH), W, r.range(1, 3));
    const band = (t * 900) % (HH + 300) - 150; const g = ctx.createLinearGradient(0, band, 0, band + 150); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.22)'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(0, band, W, 150);
    shadowed(ctx, () => { txt(ctx, '◀◀  REWIND', '800 46px "Montserrat"', 72, 270, 'left', 6); txt(ctx, '28.06.1914', '600 34px "Montserrat"', 72, 320, 'left', 6, 'rgba(255,255,255,0.85)'); }, 12, 0.9);
  };
  const filmBurn = (ctx, t, t0, t1) => {
    if (t < t0) return; const u = seg(t, t0, t1);
    const g = ctx.createRadialGradient(W * 0.8, HH * 0.15, 0, W * 0.8, HH * 0.15, 200 + u * 2200);
    g.addColorStop(0, `rgba(255,250,235,${Math.min(1, u * 2)})`); g.addColorStop(0.35, `rgba(255,170,60,${Math.min(0.95, u * 1.6)})`); g.addColorStop(0.7, `rgba(190,50,10,${u * 0.8})`); g.addColorStop(1, 'rgba(120,20,0,0)');
    ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = g; ctx.fillRect(0, 0, W, HH); ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = `rgba(0,0,0,${E.in(seg(t, t0 + (t1 - t0) * 0.55, t1))})`; ctx.fillRect(0, 0, W, HH);
  };

  // ---------------- captions ----------------
  const CAP_FONT = 900, CAP_SIZE = 80, CAP_LH = 92, CAP_MAXW = 900, CAP_Y = 1330;
  const MEAS = H.layer(8, 8).getContext('2d');
  const capLayout = (ci) => {
    const c = CAPS[ci]; if (c.lay) return c.lay;
    MEAS.font = `${CAP_FONT} ${CAP_SIZE}px "Montserrat"`; MEAS.letterSpacing = '0px';
    const toks = c[2].split(' '), tw = toks.map((s) => MEAS.measureText(s).width), sw = MEAS.measureText(' ').width, lines = [[]]; let lw = 0;
    toks.forEach((s, j) => { if (lines[lines.length - 1].length && lw + sw + tw[j] > CAP_MAXW) { lines.push([]); lw = 0; } lw += (lines[lines.length - 1].length ? sw : 0) + tw[j]; lines[lines.length - 1].push(j); });
    const pos = []; lines.forEach((ln, li) => { const w = ln.reduce((a, j, n) => a + tw[j] + (n ? sw : 0), 0); let x = W / 2 - w / 2; ln.forEach((j) => { pos[j] = { x, y: CAP_Y + (li - (lines.length - 1) / 2) * CAP_LH, w: tw[j] }; x += tw[j] + sw; }); });
    return (c.lay = { toks, pos });
  };
  const capAt = (t) => { for (let i = CAPS.length - 1; i >= 0; i--) if (t >= wt(CAPS[i][0]) - 0.1) return i; return 0; };
  const captions = (ctx, t) => {
    const ci = capAt(t), c = CAPS[ci], lay = capLayout(ci);
    ctx.save(); ctx.font = `${CAP_FONT} ${CAP_SIZE}px "Montserrat"`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.lineJoin = 'round';
    lay.toks.forEach((s, j) => {
      const wi = c[0] + j, t0 = wt(wi) - 0.05; if (t < t0 && !(ci === 0 && j === 0)) return;
      const u = ci === 0 && j === 0 ? 1 : E.out(seg(t, t0, t0 + 0.12)), p = lay.pos[j], key = c[3].includes(wi);
      ctx.save(); ctx.globalAlpha = u; ctx.translate(p.x + p.w / 2, p.y); const sc = 0.86 + 0.14 * E.back(u); ctx.scale(sc, sc);
      ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 6;
      ctx.lineWidth = 14; ctx.strokeStyle = 'rgba(0,0,0,0.9)'; ctx.strokeText(s, -p.w / 2, 0);
      ctx.shadowColor = 'transparent'; ctx.fillStyle = key && t >= wt(wi) - 0.05 ? RED : '#fff'; ctx.fillText(s, -p.w / 2, 0);
      ctx.restore();
    });
    ctx.restore();
  };

  // ---------------- finishing: vignette, grain, flicker, dust ----------------
  const finish = (ctx, t) => {
    const f = Math.floor(t * 30), r = H.rng(f + 5);
    ctx.drawImage(A.vig, 0, 0);
    ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.55; ctx.drawImage(A.grain[f % 8], 0, 0, W, HH); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = `rgba(0,0,0,${0.035 + r() * 0.05})`; ctx.fillRect(0, 0, W, HH);
    if (r() < 0.35) { ctx.fillStyle = 'rgba(255,248,230,0.18)'; ctx.fillRect(r.range(40, W - 40), 0, r.range(1, 2.5), HH); }
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(r.range(0, W), r.range(0, HH), r.range(1, 4), 0, 7); ctx.fill(); }
  };
  const flashAt = (t) => { let a = 0; for (const c of CUTS) { const d = t - c; if (d >= 0 && d < 0.14) a = Math.max(a, 0.55 * (1 - d / 0.14)); } return a; };
  const punchAt = (t) => { let p = 1; for (const c of CUTS) { const d = t - c; if (d >= 0 && d < 0.5) p = Math.max(p, 1 + 0.06 * Math.exp(-d * 9)); } return p; };

  // ---------------- the frame ----------------
  function frame(ctx, t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, HH);
    const s = SHOTS.find((x) => t >= x.t0 && t < x.t1) || SHOTS[SHOTS.length - 1];
    const punch = punchAt(t);
    if (s.img === 'rewind') rewindFX(ctx, s, t);
    else if (s.img === 'black') {
      const g = ctx.createRadialGradient(W / 2, HH * 0.45, 0, W / 2, HH * 0.45, 900); const a = 0.12 * E.inOut(seg(t, s.t0, s.t1)); g.addColorStop(0, `rgba(120,20,15,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, HH);
    } else if (s.img === 'quad') {
      const imgs = ['nicholas', 'wilhelm', 'franzjoseph', 'mehmed'], foc = [[0.46, 0.22], [0.53, 0.2], [0.47, 0.2], [0.5, 0.17]], gap = 8, cw = (W - gap) / 2, ch = (HH - gap) / 2;
      imgs.forEach((n, i) => { const x0 = (i % 2) * (cw + gap), y0 = ((i / 2) | 0) * (ch + gap), u = appear(t, s.t0 + i * 0.06, 0.25), img = A[n];
        const sc = Math.max(cw / img.width, ch / img.height) * (i === 3 ? 1.9 : 1.35) * (1 + 0.04 * seg(t, s.t0, s.t1));
        let dx = x0 + cw / 2 - foc[i][0] * img.width * sc, dy = y0 + ch * 0.4 - foc[i][1] * img.height * sc;
        dx = Math.min(x0, Math.max(x0 + cw - img.width * sc, dx)); dy = Math.min(y0, Math.max(y0 + ch - img.height * sc, dy));
        ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, cw, ch); ctx.clip(); ctx.globalAlpha = u; ctx.drawImage(img, dx, dy, img.width * sc, img.height * sc); ctx.restore(); });
      ctx.globalAlpha = 1; const u = appear(t, wt(26) - 0.05, 0.3);
      if (u > 0) { ctx.save(); ctx.globalAlpha = u; ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, HH / 2 - 120, W, 240); ctx.fillStyle = RED; ctx.fillRect(0, HH / 2 - 120, W, 6); ctx.fillRect(0, HH / 2 + 114, W, 6); shadowed(ctx, () => txt(ctx, 'STILL IN POWER', '400 130px "Anton"', W / 2, HH / 2 + 50, 'center', 3)); ctx.restore(); }
    } else if (s.img === 'map') {
      const cam = camOf(s, t, 1);
      const lit = EMP_T.map((t0) => E.out(seg(t, t0, t0 + 0.4)));
      drawMap(ctx, cam, lit, EMP_LABELS.map((l, i) => [l[0], l[1], l[2], lit[i], i === 0 ? 72 : 46]).concat([['4 EMPIRES', 0.6, 0.2, appear(t, wt(16) - 0.05, 0.25), 0]]).filter((l) => l[4]));
      const u = appear(t, wt(16) - 0.05, 0.25); if (u > 0) { ctx.save(); ctx.globalAlpha = u; shadowed(ctx, () => { txt(ctx, '4', '400 300px "Anton"', W / 2, 640, 'center'); txt(ctx, 'EMPIRES  ·  EUROPE 1914', '600 34px "Montserrat"', W / 2, 712, 'center', 7, 'rgba(255,255,255,0.9)'); }, 40, 0.9); ctx.restore(); }
    } else if (s.img === 'mapPoland') {
      const cam = camOf(s, t, 1), lit = [0.55, 0.55, 0.55, 0];
      const P = drawMap(ctx, cam, lit, [['GERMANY', 0.43, 0.5, 0.9, 50], ['RUSSIA', 0.62, 0.4, 0.9, 64], ['AUSTRIA-HUNGARY', 0.52, 0.6, 0.9, 46]]);
      const [px, py] = P(0.535, 0.475), fade = 1 - E.inOut(seg(t, wt(60), wt(60) + 0.6));
      const u = appear(t, s.t0, 0.3);
      if (fade > 0) { ctx.save(); ctx.globalAlpha = u * fade; ctx.setLineDash([16, 12]); ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.ellipse(px, py, 150, 110, -0.1, 0, 7); ctx.stroke(); ctx.setLineDash([]);
        const jit = t > wt(60) ? H.rng(Math.floor(t * 30))() * 18 - 9 : 0; shadowed(ctx, () => txt(ctx, 'POLAND?', '400 96px "Anton"', px + jit, py + 34, 'center', 3), 24, 0.95); ctx.restore(); }
      const v = appear(t, wt(61), 0.3); if (v > 0) card(ctx, ['PARTITIONED SINCE 1795', 'NOT ON THE MAP'], t, wt(61));
    } else {
      const cam = camOf(s, t, punch);
      cover(ctx, A[s.img], cam[0], cam[1], cam[2]);
      if (s.fadeAway) { const u = E.inOut(seg(t, s.fadeAway[0], s.fadeAway[1])); if (u > 0) { ctx.fillStyle = `rgba(214,200,170,${u * 0.92})`; ctx.fillRect(0, 0, W, HH); ctx.fillStyle = `rgba(0,0,0,${u * 0.35})`; ctx.fillRect(0, 0, W, HH); } }
    }
    // overlays bound to the shot
    if (s.label) label(ctx, s.label, t, s.t0);
    if (s.sub) { const u = appear(t, s.t0 + 0.3, 0.3); if (u > 0) { ctx.save(); ctx.globalAlpha = u; shadowed(ctx, () => txt(ctx, s.sub, '400 64px "Anton"', 72, 352, 'left', 3)); ctx.restore(); } }
    if (s.title) title(ctx, s.title, t, s.titleAt || s.t0, s.strike);
    if (s.plate) plate(ctx, s.plate, t, s.t0);
    if (s.card) card(ctx, s.card, t, s.cardAt);
    if (s.missed) { const u = appear(t, s.t0, 0.18); ctx.save(); ctx.globalAlpha = u; ctx.translate(W / 2, 760); ctx.rotate(-0.06); const sc = 1 + (1 - u) * 0.5; ctx.scale(sc, sc); shadowed(ctx, () => { ctx.lineWidth = 10; ctx.strokeStyle = RED; ctx.strokeRect(-330, -110, 660, 200); txt(ctx, 'MISSED', '400 170px "Anton"', 0, 62, 'center', 8, RED); }, 30, 0.8); ctx.restore(); }
    if (s.burn) filmBurn(ctx, t, s.burn[0], s.burn[1]);
    if (s.end) {
      const u = appear(t, wt(73) - 0.1, 0.35), dk = E.inOut(seg(t, wt(73) - 0.2, wt(73) + 0.3)) * (1 - E.inOut(seg(t, DURATION - 0.45, DURATION)));
      ctx.fillStyle = `rgba(0,0,0,${0.62 * dk})`; ctx.fillRect(0, 0, W, HH);
      if (u > 0) { const fo = 1 - E.inOut(seg(t, DURATION - 0.45, DURATION)); ctx.save(); ctx.globalAlpha = u * fo;
        shadowed(ctx, () => { txt(ctx, 'BETTER WORLD', '400 150px "Anton"', W / 2, 700, 'center', 3); if (t >= wt(75) - 0.05) txt(ctx, 'OR WORSE?', '400 150px "Anton"', W / 2, 870, 'center', 3, RED); }, 40, 0.9);
        if (t >= wt(76) + 0.2) txt(ctx, 'TELL ME IN THE COMMENTS  ↓', '600 34px "Montserrat"', W / 2, 960, 'center', 6, 'rgba(255,255,255,0.85)');
        ctx.restore(); }
    }
    finish(ctx, t);
    const fl = flashAt(t); if (fl > 0) { ctx.fillStyle = `rgba(255,252,240,${fl})`; ctx.fillRect(0, 0, W, HH); }
    if (!(s.end && t > wt(73) - 0.2)) captions(ctx, t);
  }

  // ---------------- sound design ----------------
  function scoreSound(k) {
    const D = DURATION;
    // low, dark pad under everything (ducked under the voice in the mix)
    k.music('pad', 0, D, { bpm: 60, chords: [['D3', 'F3', 'A3', 'D4'], ['A#2', 'D3', 'F3', 'A3'], ['G2', 'A#2', 'D3', 'G3'], ['A2', 'C#3', 'E3', 'A3']], gain: 1.6 });
    k.bed('projector', 0, D, { gain: 0.6 });
    k.tone(0, { f: 'D2', type: 'sawtooth', dur: D, gain: 0.05, a: 1.5, hold: D - 3, filter: 'lowpass', f2: 260 });
    // a clock ticking under the hook and the ending
    k.withMinor(() => { for (let t = 0.0; t < wt(7); t += 0.5) k.play('tick', t, { f: 2800, gain: 0.7 }); for (let t = wt(68); t < D - 0.3; t += 0.5) k.play('tick', t, { f: 2800, gain: 0.7 }); });
    k.play('impact', 0.0, { gain: 1.0 });
    // every cut: a whoosh into it and a deep hit on it
    CUTS.forEach((c, i) => { k.play('whoosh', c - 0.22, { dur: 0.3, gain: 0.45, top: 1800 }); k.play('thud', c, { f: 80, gain: 0.6 }); });
    // rewind: tape spinning backwards
    const r0 = SHOTS[2].t0, r1 = SHOTS[2].t1;
    k.noise(r0, { dur: r1 - r0, filter: 'bandpass', f: [[0, 3500], [r1 - r0, 600]], q: 2, gain: 0.35, a: 0.05 });
    k.tone(r0, { f: [[0, 900], [r1 - r0, 120]], type: 'sawtooth', dur: r1 - r0, gain: 0.05, filter: 'lowpass', f2: 2000 });
    k.play('glitch', r0, { gain: 0.5 }); k.play('glitch', r1 - 0.15, { gain: 0.5 });
    k.play('impact', SHOTS[3].t0 + 0.02, { gain: 1.2 }); k.play('stamp', SHOTS[3].t0 + 0.05, { gain: 0.8 });
    // strikes
    [wt(15), wt(31), wt(58)].forEach((t) => { k.play('swish', t, { dur: 0.25, gain: 0.8 }); k.play('thud', t + 0.05, { f: 120, gain: 0.7 }); });
    // empires light up / portraits
    EMP_T.forEach((t, i) => k.play('tock', t, { f: 300 + i * 40, gain: 0.5 }));
    k.play('impact', wt(16), { gain: 0.9 });
    k.play('impact', wt(26), { gain: 1.0 });
    // film burn
    const b = SHOTS[12].burn; k.noise(b[0], { dur: b[1] - b[0] + 0.3, color: 'pink', filter: 'lowpass', f: [[0, 600], [0.5, 4000], [b[1] - b[0] + 0.3, 300]], gain: 0.4, a: 0.2 });
    // darker: heartbeat in the black
    for (let i = 0; i < 2; i++) { const t = wt(36) + i * 0.75; k.play('thud', t, { f: 60, gain: 1.0 }); k.play('thud', t + 0.22, { f: 55, gain: 0.7 }); }
    k.play('riser', wt(35), { dur: 1.6, gain: 0.5 });
    // cards and labels
    k.play('tock', wt(47), { f: 400, gain: 0.5 });
    k.play('erase', wt(60), { dur: 0.6, gain: 0.7 });
    k.noise(wt(66), { dur: 1.0, color: 'pink', filter: 'highpass', f: 1500, gain: 0.12, a: 0.6 });
    // ending
    k.play('impact', wt(72), { gain: 1.2 });
    k.play('thud', wt(73), { f: 70, gain: 0.9 }); k.play('thud', wt(76), { f: 60, gain: 1.0 }); k.play('ding', wt(76) + 0.05, { f: 'D4', gain: 0.35 });
  }

  window.explainer = (ctx, W_, H_, t) => frame(ctx, t);
  window.scoreSound = scoreSound; window.DURATION = DURATION;
})();
</script>
<script>
(() => {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const D = window.DURATION, audio = document.getElementById('vo');
  let playing = false, soundOn = true, stopSound = null, clockT = 0, last = 0, useAudio = true;
  const draw = (t) => window.explainer(ctx, 1080, 1920, Math.max(0, Math.min(D - 1e-3, t)));
  window.seek = (t) => draw(t);
  const ui = (t) => { document.getElementById('scrub').value = Math.round(t / D * 1000); document.getElementById('time').textContent = t.toFixed(2) + ' / ' + D.toFixed(2); };
  const cur = () => useAudio ? audio.currentTime : clockT;
  const stopS = () => { if (stopSound) { stopSound(); stopSound = null; } };
  const startS = () => { stopS(); if (soundOn) stopSound = SOUND.live(window.scoreSound, cur(), { voiceover: false }); };
  const play = () => { playing = true; document.getElementById('play').textContent = 'Pause'; if (useAudio) { audio.muted = !soundOn; audio.play().catch(() => { useAudio = false; }); } last = performance.now(); startS(); };
  const pause = () => { playing = false; document.getElementById('play').textContent = 'Play'; audio.pause(); stopS(); };
  const setT = (t) => { if (useAudio) audio.currentTime = t; clockT = t; draw(t); ui(t); if (playing) startS(); };
  document.getElementById('play').onclick = () => playing ? pause() : play();
  document.getElementById('scrub').oninput = (e) => setT(e.target.value / 1000 * D);
  document.getElementById('snd').onclick = (e) => { soundOn = !soundOn; e.target.textContent = 'Sound: ' + (soundOn ? 'on' : 'off'); audio.muted = !soundOn; if (!soundOn) stopS(); else if (playing) startS(); };
  document.getElementById('file').onchange = (e) => { const f = e.target.files[0]; if (!f) return; audio.src = URL.createObjectURL(f); pause(); setT(0); };
  const tick = (now) => { if (playing) { if (useAudio) { if (audio.currentTime >= D - 0.03 || audio.ended) { audio.currentTime = 0; audio.play(); startS(); } } else { clockT += (now - last) / 1000; if (clockT >= D) { clockT = 0; startS(); } } last = now; const t = cur(); draw(t); ui(t); } requestAnimationFrame(tick); };
  const specs = ['400 100px "Anton"', '900 80px "Montserrat"', '800 40px "Montserrat"', '600 34px "Montserrat"'];
  window.ready = Promise.all(specs.map((s) => document.fonts.load(s, 'AZ09◀↓…’'))).then(() => window.loadAssets()).then(() => { draw(0); ui(0); requestAnimationFrame(tick); return true; });
})();
</script></body></html>
