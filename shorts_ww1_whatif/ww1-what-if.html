// Shared helpers + style registry for the style-frame explorations.
// Every style is a pure function of time: draw(ctx, W, H, t). Same t => same pixels.
(function () {

  // H.rng(seed) -> r() in [0,1). Extras: r.range(a,b), r.int(a,b), r.pick(arr), r.gauss(), r.chance(p)

    r.int = (lo, hi) => Math.floor(lo + r() * (hi - lo + 1));

    r.chance = (p) => r() < p;
    r.gauss = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

  H.paper = function (ctx, W, Hh, base = '#f3ecdc', seed = 3, strength = 0.06) {

      const s = 1 + v * strength * 2;

  H.vignette = function (ctx, W, Hh, strength = 0.5, color = '0,0,0') {
    const g = ctx.createRadialGradient(W / 2, Hh / 2, Math.min(W, Hh) * 0.3, W / 2, Hh / 2, Math.hypot(W, Hh) * 0.6);

  // ---------- rendering entry ----------
  // Renders style into canvas at logical 1280x720 (canvas can be any pixel size; it is scaled).
  H.W = 1280; H.H = 720;
  H.loadFonts = async function (style) {
    const specs = style.fonts || [];
    try { const sample = 'AaZz09' + (window.FONT_SAMPLE || '');
      await Promise.all(specs.map((f) => document.fonts.load(f, sample))); await document.fonts.ready; } catch (e) { /* render anyway */ }
  };
  H.render = function (style, canvas, t) {

    ctx.restore();
  };
})();

<script>
// sound.js: a small synthesized sound kit for the style explainers. Plain Web Audio, no audio files.
// Voiceover mode: SOUND.kit(ctx, { voiceover: true }) drops beds and music, plays anything marked minor
// (play(..., { minor: true }), tone/noise { minor: true }, or scheduled inside k.withMinor(() => ...)) at about 60%
// volume instead of full, and sits all effects a little lower, so the narration stays on top while the piece still
// sounds alive. In the full mix, minor sounds play at full volume. Scores can read k.vo to branch further.
// A style adds   explainerSound(k) { k.bed('room', 0, D); k.play('pop', 1.25); ... }   and the same
// call schedules into a live AudioContext (the player) or an OfflineAudioContext (the video render).
// Times are seconds on the explainer's own clock. Randomness is seeded, so every render is identical.
(function () {
  'use strict';
  const SOUND = (window.SOUND = {});
  const TINY = 1e-4;

  // seeded random in [0,1), keyed by any string
  function rand(key) {
    let h = 2166136261;
    for (let i = 0; i < key.length; i++) { h ^= key.charCodeAt(i); h = Math.imul(h, 16777619); }
    let a = h >>> 0 || 1;
    return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // note names to Hz: 'A4' = 440, 'C#5', 'Eb3'
  const STEP = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function hz(n) {
    if (typeof n === 'number') return n;
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(n);
    const semis = STEP[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (Number(m[3]) - 4) * 12 - 9;
    return 440 * Math.pow(2, semis / 12);
  }
  SOUND.hz = hz;

  SOUND.kit = function (ctx, opts) {
    const o = opts || {};
    const VO = !!o.voiceover;
    const MINOR = 0.6; // voiceover-mode volume for minor sounds
    let inMinor = false;
    const gainOf = (p, d) => (p.gain == null ? d : p.gain) * (VO && (p.minor || inMinor) ? MINOR : 1);
    const T0 = (o.start || 0) - 0; // explainer time that maps to ctx time `base`
    const base = ctx.currentTime + (o.delay || 0);
    // Start times snap to the sample grid (+ a quarter sample): in Chrome a source started a hair off the grid can
    // spike to about twice its set level.
    const SR = ctx.sampleRate;
    const at = (t) => (Math.round((base + (t - T0)) * SR) + 0.25) / SR;

    // ---- buses: sfx, amb, music -> compressor -> master; one shared reverb send
    const master = ctx.createGain(); master.gain.value = o.master == null ? 0.9 : o.master;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.18;
    comp.connect(master); master.connect(o.dest || ctx.destination);
    const bus = {};
    for (const [name, g] of Object.entries({ sfx: VO ? 0.7 : 0.85, amb: 0.5, music: 0.45 })) { bus[name] = ctx.createGain(); bus[name].gain.value = g; bus[name].connect(comp); }

    // generated room reverb: decaying stereo noise, darker toward the tail
    const verb = ctx.createConvolver();
    {
      const secs = 1.6, n = Math.floor(secs * ctx.sampleRate), ir = ctx.createBuffer(2, n, ctx.sampleRate);
      for (let c = 0; c < 2; c++) {

      }

    }

    // seeded noise buffers: white, pink-ish and brown
    const noiseBuf = {};

      const n = Math.floor(2.5 * ctx.sampleRate);
      for (const kind of ['white', 'pink', 'brown']) {
        const b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0), r = rand('noise-' + kind);
        let p0 = 0, p1 = 0, p2 = 0, br = 0;
        for (let i = 0; i < n; i++) {
          const w = r() * 2 - 1;
          if (kind === 'white') d[i] = w;
          else if (kind === 'pink') { p0 = 0.997 * p0 + 0.029 * w; p1 = 0.985 * p1 + 0.032 * w; p2 = 0.95 * p2 + 0.048 * w; d[i] = (p0 + p1 + p2 + w * 0.05) * 2.2; }

    }

    // ---- automation helpers
    // a value or [[dt, value], ...] from the voice start; ramps are exponential (frequencies)
    function sweep(param, v, t) {

    // ---- primitives
    // tone(t, { f, type, dur, gain, a, hold, pan, verb, bus, filter, f2 (filter freq), q, detune })

      node.connect(g); out(g, p);

    }
    // noise(t, { dur, color, filter, f, q, gain, a, hold, pan, verb, bus, rate })
    function noise(time, p) {
      const t = at(time), dur = p.dur || 0.2;

      const src = ctx.createBufferSource(); src.buffer = noiseBuf[p.color || 'white']; src.loop = true;
      if (p.rate) src.playbackRate.value = p.rate;
      const g = ctx.createGain(); shape(g.gain, t, gainOf(p, 0.3), dur, p.a, p.hold);
      const f = filterNode(p, t);

    // ---- named sounds. play(name, t, opts): opts.gain scales the whole sound, opts.pan places it.
    const S = {
      // UI / motion graphics
      pop: (t, o) => { tone(t, { f: [[0, o.f || 620], [0.07, (o.f || 620) * 0.45]], dur: 0.1, gain: 0.32 * o.g, pan: o.pan }); noise(t, { dur: 0.012, filter: 'highpass', f: 3000, gain: 0.12 * o.g, pan: o.pan }); },
      tick: (t, o) => noise(t, { dur: 0.018, filter: 'bandpass', f: o.f || 4200, q: 2.5, gain: 0.3 * o.g, pan: o.pan }),
      click: (t, o) => { tone(t, { f: o.f || 1900, type: 'square', dur: 0.02, gain: 0.08 * o.g, filter: 'lowpass', f2: 3000, pan: o.pan }); noise(t, { dur: 0.01, filter: 'highpass', f: 2500, gain: 0.15 * o.g, pan: o.pan }); },
      tock: (t, o) => { tone(t, { f: o.f || 820, dur: 0.07, gain: 0.25 * o.g, pan: o.pan }); noise(t, { dur: 0.05, filter: 'bandpass', f: o.f || 820, q: 9, gain: 0.35 * o.g, pan: o.pan }); },
      blip: (t, o) => tone(t, { f: o.f || 'E6', type: o.type || 'square', dur: o.dur || 0.07, gain: 0.07 * o.g, a: 0.002, hold: (o.dur || 0.07) * 0.6, pan: o.pan }),
      whoosh: (t, o) => { const d = o.dur || 0.45; noise(t, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 350], [d * 0.55, o.top || 2600], [d, 700]], q: 0.9, gain: 0.32 * o.g, a: d * 0.5, pan: o.pan, verb: 0.15 }); },
      swish: (t, o) => { const d = o.dur || 0.18; noise(t, { dur: d, filter: 'highpass', f: [[0, 1800], [d, 5200]], q: 0.7, gain: 0.22 * o.g, a: d * 0.35, pan: o.pan }); },
      riser: (t, o) => { const d = o.dur || 0.8; noise(t, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 300], [d, 4000]], q: 1.2, gain: 0.25 * o.g, a: d * 0.95, pan: o.pan, verb: 0.2 }); tone(t, { f: [[0, 180], [d, 720]], type: 'triangle', dur: d, gain: 0.06 * o.g, a: d * 0.9 }); },
      thud: (t, o) => { tone(t, { f: [[0, o.f || 130], [0.16, 42]], dur: 0.26, gain: 0.55 * o.g, pan: o.pan }); noise(t, { dur: 0.09, color: 'brown', filter: 'lowpass', f: 500, gain: 0.35 * o.g, pan: o.pan }); },
      impact: (t, o) => { S.thud(t, o); noise(t, { dur: 0.7, color: 'pink', filter: 'lowpass', f: [[0, 2400], [0.6, 300]], gain: 0.3 * o.g, verb: 0.35, pan: o.pan }); },
      stamp: (t, o) => { S.thud(t, { ...o, f: 160 }); noise(t, { dur: 0.05, filter: 'bandpass', f: 1300, q: 1.2, gain: 0.4 * o.g, pan: o.pan }); noise(t + 0.004, { dur: 0.012, filter: 'highpass', f: 3500, gain: 0.25 * o.g, pan: o.pan }); },
      ding: (t, o) => { const f = hz(o.f || 'E6'); tone(t, { f, dur: 1.3, gain: 0.2 * o.g, verb: 0.3, pan: o.pan }); tone(t, { f: f * 2.76, dur: 0.5, gain: 0.05 * o.g, verb: 0.3, pan: o.pan }); },
      success: (t, o) => { S.ding(t, { ...o, f: o.f || 'C6' }); S.ding(t + 0.09, { ...o, f: hz(o.f || 'C6') * 1.5, g: o.g * 0.9 }); },

      glitch: (t, o) => { const r = rand('glitch' + t); for (let i = 0; i < 7; i++) tone(t + i * 0.022, { f: 200 + r() * 1800, type: 'square', dur: 0.02, gain: 0.07 * o.g, a: 0.001, hold: 0.015, pan: r() * 1.4 - 0.7 }); noise(t, { dur: 0.16, filter: 'bandpass', f: 2500, q: 0.6, gain: 0.12 * o.g }); },
      shutter: (t, o) => { S.click(t, o); noise(t + 0.06, { dur: 0.04, filter: 'bandpass', f: 2200, q: 1, gain: 0.2 * o.g, pan: o.pan }); },
      count: (t, o) => S.tick(t, { ...o, f: o.f || 5200, g: o.g * 0.7 }),

      // hand-made media
      // stroke: a pen/marker/chalk/pencil stroke over `dur` seconds. material sets the surface sound.
      stroke: (t, o) => {

          chalk: { f: 1700, q: 0.6, g: 0.22, grain: 0.028 },
          pencil: { f: 4600, q: 0.8, g: 0.16, grain: 0.04, filter: 'highpass' },
          pen: { f: 4200, q: 1.6, g: 0.08, grain: 0.06 },
          brush: { f: 900, q: 0.5, g: 0.1, grain: 0.09, color: 'pink' },

      },
      // paper: picking up / slapping down / turning a sheet
      paper: (t, o) => { const d = o.dur || 0.35, r = rand('paper' + t); for (let x = 0; x < d; x += 0.025 + r() * 0.03) noise(t + x, { dur: 0.05, filter: 'bandpass', f: 1200 + r() * 2600, q: 0.9, gain: 0.12 * o.g * (1 - x / d * 0.5), pan: o.pan }); },
      slap: (t, o) => { noise(t, { dur: 0.07, filter: 'highpass', f: 900, gain: 0.45 * o.g, a: 0.001, pan: o.pan }); tone(t, { f: [[0, 180], [0.06, 70]], dur: 0.1, gain: 0.25 * o.g, pan: o.pan }); },
      tape: (t, o) => { noise(t, { dur: o.dur || 0.5, filter: 'bandpass', f: [[0, 900], [o.dur || 0.5, 2200]], q: 1.8, gain: 0.18 * o.g, a: 0.02, pan: o.pan }); },

    const nz = H.makeNoise(9);
    for (const S of SHEETS) {
      const st = H.layer(S.w, S.h), sx = st.getContext('2d'); sx.fillStyle = '#000'; sx.strokeStyle = '#000'; S.stat(sx); S.statC = st;
      const GW = Math.ceil(S.w / 4), GH = Math.ceil(S.h / 4), low = new Float32Array(GW * GH * 2);
      for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) { low[(y * GW + x) * 2] = nz.fbm2(x * 0.03, y * 0.03, 4); low[(y * GW + x) * 2 + 1] = nz.fbm2(x * 0.125 + 50, y * 0.125, 3); }
      S.low = low; S.GW = GW; S.GH = GH;
      const c = H.layer(S.w, S.h), x = c.getContext('2d'); x.translate(S.w, 0); x.scale(-1, 1); backLayout(x, H.rng(S.back), S.w, S.h);
      const b = H.layer(S.w, S.h), bx = b.getContext('2d', { willReadFrequently: true }); bx.filter = 'blur(1.6px)'; bx.drawImage(c, 0, 0);
      const d = bx.getImageData(0, 0, S.w, S.h).data, a = new Uint8Array(S.w * S.h); for (let i = 0; i < a.length; i++) a[i] = d[i * 4 + 3]; S.backA = a;
    }
    READY = true;
  };

  // ---------------- print one sheet through the camera (paper + show-through + uneven ink; from the reference) ----------------
  const renderSheet = (si, t, cam, slot) => {
    const S = SHEETS[si], [cx, cy, z] = cam;
    const ink = getL('ink' + slot, W, HH), k = ctx2(ink);
    k.setTransform(1, 0, 0, 1, 0, 0); k.clearRect(0, 0, W, HH);
    k.setTransform(z, 0, 0, z, W / 2 - cx * z, HH / 2 - cy * z);
    k.drawImage(S.statC, 0, 0); k.fillStyle = '#000'; k.strokeStyle = '#000'; S.dyn(k, t);
    k.setTransform(1, 0, 0, 1, 0, 0);
    const fd = k.getImageData(0, 0, W, HH).data, bd = S.backA, low = S.low, GW = S.GW, SW = S.w, SH = S.h;
    const out = getL('out' + slot, W, HH), oc = ctx2(out);
    const img = POOL['img' + slot] || (POOL['img' + slot] = oc.createImageData(W, HH)), o = img.data, iz = 1 / z;
    for (let y = 0; y < HH; y++) {
      const py = cy + (y - HH / 2) * iz, ipy = py | 0;
      for (let x = 0; x < W; x++) {
        const i = (y * W + x) * 4, px = cx + (x - W / 2) * iz, ipx = px | 0;
        if (px < 0 || py < 0 || px >= SW || py >= SH) {
          const dd = Math.max(-px, px - SW, -py, py - SH), sh = 1 - 0.5 * Math.exp(-dd / 14);
          const n = (nhash(x, y, 3) - 0.5) * 6; o[i] = (38 + n) * sh; o[i + 1] = (32 + n) * sh; o[i + 2] = (28 + n) * sh; o[i + 3] = 255; continue;
        }
        const li = (ipy >> 2) * GW + (ipx >> 2), m = low[li * 2], f = low[li * 2 + 1], hh = nhash(ipx, ipy, 1);
        const edge = Math.min(px, SW - px, py * 1.3, SH - py) / 160, age = 0.07 * (1 - cl(edge)) + m * 0.035 + f * 0.015;
        let r = PAPER[0] * (1 - age * 0.7) + (hh - 0.5) * 12, g = PAPER[1] * (1 - age) + (hh - 0.5) * 12, b = PAPER[2] * (1 - age * 1.6) + (hh - 0.5) * 12;
        if (nhash(ipx >> 1, ipy >> 1, 4) > 0.9975) { r -= 40; g -= 40; b -= 38; }
        const bt = (bd[ipy * SW + ipx] / 255) * 0.075; r *= 1 - bt; g *= 1 - bt * 1.05; b *= 1 - bt * 1.1;
        const a = fd[i + 3] / 255;

          let cov = cl((a - (0.5 + (nhash(ipx, ipy, 2) - 0.5) * 0.35 + f * 0.15)) * 3 + 0.5) * 0.65 + a * 0.35;
          let dens = 0.86 + m * 0.12 + (nhash(ipx, ipy, 3) - 0.5) * 0.12; if (nhash(ipx, ipy, 5) < 0.025) dens *= 0.45;
          cov *= cl(dens); r = r * (1 - cov) + INK[0] * cov; g = g * (1 - cov) + INK[1] * cov; b = b * (1 - cov) + INK[2] * cov;
        }

      }
    }
    oc.putImageData(img, 0, 0); return out;
  };

  // ---------------- cameras ----------------
  const CAM = {
    A1: [[0, 540, 980, 1.0], [wt(4), 540, 1000, 1.06], [wt(7), 540, 1010, 1.1], [SC.spin1[0], 540, 1010, 1.1]],
    B: [[SC.spin1[1], 540, 960, 1.0], [wt(15), 540, 975, 1.03], [WORDS[15][1] + 0.1, 540, 975, 1.03], [wt(16) - 0.02, 540, 1940, 1.0], [wt(26), 540, 1965, 1.02], [wt(27) - 0.1, 540, 1965, 1.02], [wt(29) - 0.05, 540, 3440, 1.0], [wt(35), 540, 3455, 1.02], [SC.turn[0], 540, 3480, 1.07]],
    C: [[SC.turn[1], 540, 960, 1.0], [wt(51) - 0.9, 540, 985, 1.03], [wt(51) - 0.05, 540, 1300, 1.0], [wt(59) - 0.75, 540, 1320, 1.02], [wt(59) - 0.05, 540, 2700, 1.0], [SC.spin2[0], 540, 2725, 1.03]],
    A2: [[SC.spin2[1], 540, 1010, 1.1], [wt(72), 540, 1000, 1.12], [wt(73) + 0.3, 540, 990, 1.06], [DURATION - 0.25, 540, 980, 1.0]],
  };
  const camAt = (K, t) => {
    if (t <= K[0][0]) return K[0].slice(1);
    for (let i = 0; i < K.length - 1; i++) if (t < K[i + 1][0]) { const a = K[i], b = K[i + 1], u = E.inOut(seg(t, a[0], b[0])); return [H.lerp(a[1], b[1], u), H.lerp(a[2], b[2], u), H.lerp(a[3], b[3], u)]; }
    return K[K.length - 1].slice(1);
  };

  // ---------------- red grease pencil (the reader's marks) ----------------
  const grease = (ctx, pts, u, seed, width = 7) => {
    if (u <= 0) return; const rr = H.rng(seed), n = Math.max(2, Math.ceil(pts.length * cl(u)));
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let pass = 0; pass < 3; pass++) {
      ctx.strokeStyle = `rgba(196,38,34,${0.62 - pass * 0.13})`; ctx.lineWidth = width - pass * 1.6; ctx.beginPath();
      const jx = rr.range(-3, 3), jy = rr.range(-3, 3);
      for (let i = 0; i < n; i++) { const p = pts[i]; i ? ctx.lineTo(p[0] + jx, p[1] + jy) : ctx.moveTo(p[0] + jx, p[1] + jy); }
      ctx.stroke();
    }
    ctx.restore();
  };
  const ringPts = (cx, cy, rx, ry) => { const p = []; for (let i = 0; i <= 64; i++) { const a = -2.4 + (i / 64) * Math.PI * 2.25, wob = 1 + 0.04 * Math.sin(i * 0.7); p.push([cx + Math.cos(a) * rx * wob, cy + Math.sin(a) * ry * wob]); } return p; };
  const linePts = (x0, y0, x1, y1, bow = 6) => { const p = []; for (let i = 0; i <= 24; i++) { const s = i / 24; p.push([H.lerp(x0, x1, s), H.lerp(y0, y1, s) - Math.sin(s * Math.PI) * bow]); } return p; };
  const checkPts = (x, y, s) => [[x - s, y], [x - s * 0.3, y + s * 0.8], [x + s * 1.3, y - s * 1.1]].flatMap((p, i, arr) => i ? linePts(arr[i - 1][0], arr[i - 1][1], p[0], p[1], 0).slice(1) : [p]);
  const onPage = (ctx, cam, fn) => { const [cx, cy, z] = cam; ctx.save(); ctx.setTransform(z, 0, 0, z, W / 2 - cx * z, HH / 2 - cy * z); fn(); ctx.restore(); };
  const pageMarks = (ctx, si, t, cam) => onPage(ctx, cam, () => {
    if (si === 0) {
      const bc = [L + 0.42 * PW + 40, 860 + 0.52 * 560];
      if (t < SC.spin1[0]) {
        grease(ctx, ringPts(bc[0], bc[1], 170, 92), seg(t, wt(2), wt(2) + 0.35), 3, 9);
        grease(ctx, linePts(L - 10, 525, R + 10, 520, 4), seg(t, wt(8), wt(8) + 0.18), 11, 11);
        grease(ctx, linePts(L - 10, 705, R + 10, 700, 4), seg(t, wt(8) + 0.14, wt(8) + 0.32), 12, 11);
      } else grease(ctx, ringPts(bc[0], bc[1], 170, 92), seg(t, wt(72), wt(72) + 0.3), 4, 10);
    } else if (si === 1) {
      for (let i = 0; i < 4; i++) { const [x0, y0, w] = cellAt(i), cx = x0 + w / 2, e = EMP[i];
        grease(ctx, linePts(cx - 175, y0 + 512, cx + 175, y0 + 508, 3), seg(t, e.t + 0.2, e.t + 0.42), 20 + i, 8);
        grease(ctx, checkPts(cx + 150, y0 + 70, 30), seg(t, wt(26) + i * 0.07, wt(26) + i * 0.07 + 0.2), 30 + i, 9); }
      grease(ctx, linePts(L + 20, NEVY + 212, R - 20, NEVY + 206, 5), seg(t, wt(29), wt(29) + 0.3), 41, 11);
      grease(ctx, linePts(L + 20, NEVY + 412, R - 20, NEVY + 406, 5), seg(t, wt(32), wt(32) + 0.3), 42, 11);
      grease(ctx, linePts(250, NEVY + 560, 830, NEVY + 1020, 0), seg(t, wt(33), wt(33) + 0.2), 43, 16);
      grease(ctx, linePts(830, NEVY + 560, 250, NEVY + 1020, 0), seg(t, wt(33) + 0.18, wt(33) + 0.38), 44, 16);
    } else {
      grease(ctx, ringPts(515, 1425, 510, 84), seg(t, wt(47) + 0.1, wt(47) + 0.45), 51, 9);
    }
  });

  // ---------------- caption slips (pasted-on newsprint strips; user asked for big bold captions) ----------------
  const MEAS = H.layer(8, 8).getContext('2d');
  const CAP_SIZE = 112, CAP_LH = 122, CAP_MAXW = 900;
  const capLayout = (ci) => {
    const c = CAPS[ci]; if (c.lay) return c.lay;
    const toks = c[2].split(' '); MEAS.font = `700 ${CAP_SIZE}px "Oswald"`; MEAS.letterSpacing = '2px';
    const sw = MEAS.measureText(' ').width, lines = [[]]; let lw = 0;
    const tw = toks.map((s) => MEAS.measureText(s).width);
    toks.forEach((s, j) => { const w = tw[j]; if (lines[lines.length - 1].length && lw + sw + w > CAP_MAXW) { lines.push([]); lw = 0; } lw += (lines[lines.length - 1].length ? sw : 0) + w; lines[lines.length - 1].push(j); });
    const lineW = lines.map((ln) => ln.reduce((s, j, n) => s + tw[j] + (n ? sw : 0), 0));
    const maxW = Math.max(...lineW), w = maxW + 90, h = lines.length * CAP_LH + 46;
    const pos = [];
    lines.forEach((ln, li) => { let x = -lineW[li] / 2; ln.forEach((j) => { pos[j] = { x, y: -h / 2 + 23 + (li + 1) * CAP_LH - 26, w: tw[j] }; x += tw[j] + sw; }); });
    const rr = H.rng(100 + ci), poly = [], jit = () => rr.range(-3, 3);
    for (let x = -w / 2; x < w / 2; x += 50) poly.push([x, -h / 2 + jit()]);
    for (let y = -h / 2; y < h / 2; y += 50) poly.push([w / 2 + jit(), y]);
    for (let x = w / 2; x > -w / 2; x -= 50) poly.push([x, h / 2 + jit()]);
    for (let y = h / 2; y > -h / 2; y -= 50) poly.push([-w / 2 + jit(), y]);
    return (c.lay = { toks, pos, w, h, poly, rot: (ci % 2 ? 1 : -1) * 0.022 });
  };
  const capAt = (t) => { for (let i = CAPS.length - 1; i >= 0; i--) if (t >= wt(CAPS[i][0]) - 0.12 || i === 0) return i; return 0; };
  const SLIP_C = [540, 1650];
  const slipPass = (ctx, t) => {
    const ci = capAt(t), c = CAPS[ci], lay = capLayout(ci);
    const RW = 1080, RH = Math.min(HH, Math.ceil(lay.h + 140)), R0 = Math.round(SLIP_C[1] - RH / 2);
    const xf = (k) => { k.setTransform(1, 0, 0, 1, 0, 0); k.translate(SLIP_C[0], SLIP_C[1] - R0); k.rotate(lay.rot); };
    const mask = getL('smask', RW, RH), mk = ctx2(mask); mk.setTransform(1, 0, 0, 1, 0, 0); mk.clearRect(0, 0, RW, RH); xf(mk); mk.fillStyle = '#000'; mk.beginPath(); lay.poly.forEach((p, i) => (i ? mk.lineTo(p[0], p[1]) : mk.moveTo(p[0], p[1]))); mk.closePath(); mk.fill();
    const shad = getL('sshad', RW, RH), sk = ctx2(shad); sk.setTransform(1, 0, 0, 1, 0, 0); sk.clearRect(0, 0, RW, RH); sk.filter = 'blur(12px)'; sk.drawImage(mask, 6, 16); sk.filter = 'none';
    const ink = getL('sink', RW, RH), ik = ctx2(ink); ik.setTransform(1, 0, 0, 1, 0, 0); ik.clearRect(0, 0, RW, RH); xf(ik); ik.fillStyle = '#000';
    ik.font = `700 ${CAP_SIZE}px "Oswald"`; ik.textAlign = 'left'; ik.textBaseline = 'alphabetic'; ik.letterSpacing = '2px';
    lay.toks.forEach((s, j) => { const t0 = wt(c[0] + j) - 0.06; if (t < t0 && !(ci === 0 && j === 0)) return; const p = lay.pos[j], u = ci === 0 && j === 0 ? 1 : seg(t, t0, t0 + 0.1), sc = 1 + (1 - E.out(u)) * 0.25;
      ik.save(); ik.translate(p.x + p.w / 2, p.y - CAP_SIZE * 0.35); ik.scale(sc, sc); ik.fillText(s, -p.w / 2, CAP_SIZE * 0.35); ik.restore(); });
    ik.letterSpacing = '0px';
    const md = mk.getImageData(0, 0, RW, RH).data, sd = sk.getImageData(0, 0, RW, RH).data, idd = ik.getImageData(0, 0, RW, RH).data;
    const img = ctx.getImageData(0, R0, RW, RH), o = img.data;
    for (let y = 0; y < RH; y++) for (let x = 0; x < RW; x++) {
      const i = (y * RW + x) * 4, gy = y + R0;
      let r = o[i], g = o[i + 1], b = o[i + 2];
      const sh = (sd[i + 3] / 255) * 0.5; r *= 1 - sh; g *= 1 - sh; b *= 1 - sh;
      const m = md[i + 3] / 255;
      if (m > 0) { const hh = nhash(x, gy, 11), f = nhash(x >> 3, gy >> 3, 12);
        const pr = SLIP[0] * (1 - f * 0.03) + (hh - 0.5) * 12, pg = SLIP[1] * (1 - f * 0.035) + (hh - 0.5) * 12, pb = SLIP[2] * (1 - f * 0.05) + (hh - 0.5) * 12;
        r = r * (1 - m) + pr * m; g = g * (1 - m) + pg * m; b = b * (1 - m) + pb * m;
        const a = idd[i + 3] / 255;
        if (a > 0) { let cov = cl((a - (0.5 + (nhash(x, gy, 2) - 0.5) * 0.35)) * 3 + 0.5) * 0.65 + a * 0.35; let dens = 0.9 + (nhash(x, gy, 3) - 0.5) * 0.12; if (nhash(x, gy, 5) < 0.025) dens *= 0.5; cov *= cl(dens) * m; r = r * (1 - cov) + INK[0] * cov; g = g * (1 - cov) + INK[1] * cov; b = b * (1 - cov) + INK[2] * cov; }
      }
      o[i] = r; o[i + 1] = g; o[i + 2] = b;
    }
    ctx.putImageData(img, 0, R0);
    // red grease underline under the key word as it is spoken
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.translate(SLIP_C[0], SLIP_C[1]); ctx.rotate(lay.rot);
    c[3].forEach((wi, n) => { const j = wi - c[0], p = lay.pos[j]; grease(ctx, linePts(p.x - 8, p.y + 20, p.x + p.w + 8, p.y + 16, 3), seg(t, wt(wi), wt(wi) + 0.22), 200 + ci * 7 + n, 12); });
    ctx.restore();
  };

  // ---------------- scene transitions in the medium's own way ----------------
  const darkBg = (ctx) => { const bg = ctx.createRadialGradient(W / 2, HH / 2, 80, W / 2, HH / 2, 1200); bg.addColorStop(0, '#2b2622'); bg.addColorStop(1, '#0b0a09'); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, HH); };
  const spin = (ctx, page, sc, rot, a = 1) => { ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, HH / 2); ctx.rotate(rot); ctx.scale(sc, sc); ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 50 * sc; ctx.shadowOffsetY = 16 * sc; ctx.drawImage(page, -W / 2, -HH / 2); ctx.restore(); };
  const spinTransition = (ctx, t, [t0, t1], siOut, camOut, siIn, camIn) => {
    darkBg(ctx); const mid = t0 + (t1 - t0) * 0.4;
    if (t < mid) { const u = E.in(seg(t, t0, mid)); const pg = renderSheet(siOut, t0, camOut, 0); for (let k = 3; k >= 1; k--) { const uu = E.in(seg(t - k * 0.02, t0, mid)); spin(ctx, pg, H.lerp(1, 0.04, uu), uu * Math.PI * 3, 0.14); } spin(ctx, pg, H.lerp(1, 0.04, u), u * Math.PI * 3); }
    else { const u = E.out(seg(t, mid, t1)); const pg = renderSheet(siIn, t1, camIn, 0); const pose = (uu) => [H.lerp(0.04, 1, uu), (1 - uu) * -Math.PI * 4.2]; for (let k = 3; k >= 1; k--) { const p = pose(E.out(seg(t - k * 0.018, mid, t1))); spin(ctx, pg, p[0], p[1], 0.14); } const p = pose(u); spin(ctx, pg, p[0], p[1]); }
  };
  const pageTurn = (ctx, t, [t0, t1], siOut, camOut, siIn, camIn) => {
    ctx.drawImage(renderSheet(siIn, t, camIn, 1), 0, 0);
    const u = E.inOut(seg(t, t0, t1)), c = Math.cos(Math.PI * u);
    const sx = W * Math.max(0, c), sg = ctx.createLinearGradient(sx, 0, sx + 180 * (1 - Math.abs(c)) + 10, 0); sg.addColorStop(0, 'rgba(0,0,0,0.35)'); sg.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = sg; ctx.fillRect(sx, 0, 200, HH);
    ctx.save(); const lift = Math.sin(Math.PI * u) * 30;
    if (c > 0) { const leaf = renderSheet(siOut, t0, camOut, 0); ctx.transform(c, -lift / W * 0.6, 0, 1, 0, 0); ctx.drawImage(leaf, 0, 0); ctx.fillStyle = `rgba(0,0,0,${0.35 * (1 - c)})`; ctx.fillRect(0, 0, W, HH); }
    else { ctx.transform(c, lift / W * 0.6, 0, 1, 0, 0); ctx.fillStyle = `rgb(${PAPER[0] - 20},${PAPER[1] - 22},${PAPER[2] - 26})`; ctx.fillRect(0, 0, W, HH); }
    ctx.restore();
  };
  // the room light dims: "and it gets darker"
  const dimAt = (t) => { if (t < wt(37)) return 0; if (t < SC.turn[1]) return 0.5 * E.inOut(seg(t, wt(37), WORDS[38][1])); if (t < SC.spin2[0]) return 0.5 - 0.22 * E.inOut(seg(t, SC.turn[1], SC.turn[1] + 1.5)); return 0.28 * (1 - seg(t, SC.spin2[0], SC.spin2[1])); };
  const dim = (ctx, a) => { if (a <= 0.001) return; const g = ctx.createRadialGradient(W / 2, HH * 0.42, 200, W / 2, HH / 2, 1250); g.addColorStop(0, `rgba(12,9,6,${a * 0.35})`); g.addColorStop(1, `rgba(12,9,6,${Math.min(0.92, a * 1.5)})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, HH); };

  // ---------------- the explainer ----------------
  function explainer(ctx, W_, H_, t) {
    if (!READY) init();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    let flat = null;
    if (t < SC.spin1[0]) flat = [0, camAt(CAM.A1, t)];
    else if (t < SC.spin1[1]) spinTransition(ctx, t, SC.spin1, 0, camAt(CAM.A1, SC.spin1[0]), 1, camAt(CAM.B, SC.spin1[1]));
    else if (t < SC.turn[0]) flat = [1, camAt(CAM.B, t)];
    else if (t < SC.turn[1]) pageTurn(ctx, t, SC.turn, 1, camAt(CAM.B, SC.turn[0]), 2, camAt(CAM.C, SC.turn[1]));
    else if (t < SC.spin2[0]) flat = [2, camAt(CAM.C, t)];
    else if (t < SC.spin2[1]) spinTransition(ctx, t, SC.spin2, 2, camAt(CAM.C, SC.spin2[0]), 0, camAt(CAM.A2, SC.spin2[1]));
    else flat = [0, camAt(CAM.A2, t)];
    if (flat) { ctx.drawImage(renderSheet(flat[0], t, flat[1], 0), 0, 0); pageMarks(ctx, flat[0], t, flat[1]); }
    dim(ctx, dimAt(t));
    slipPass(ctx, t);
  }

  // ---------------- sound: presses and paper (voiceover mode) ----------------
  function scoreSound(k) {
    const D = DURATION;
    const rustle = (t, d, g) => { k.play('paper', t, { dur: d, gain: 0.22 * g, minor: true }); k.noise(t, { minor: true, dur: d, color: 'pink', filter: 'lowpass', f: 900, gain: 0.08 * g, a: d * 0.4 }); };
    const knock = (t, g, p = 0, minor) => { k.tone(t, { minor: !!minor, f: [[0, 160], [0.06, 85]], dur: 0.1, gain: 0.32 * g, pan: p }); k.noise(t, { minor: !!minor, dur: 0.05, color: 'pink', filter: 'bandpass', f: 700, q: 0.9, gain: 0.3 * g, a: 0.002, pan: p }); };
    const tap = (t, g, p = 0) => k.noise(t, { minor: true, dur: 0.03, filter: 'bandpass', f: 1100, q: 1.2, gain: 0.22 * g, a: 0.001, pan: p });
    const rulePen = (t, d, g, p = 0) => k.play('stroke', t, { material: 'pen', dur: d, gain: g * 1.5, pan: p, minor: true });
    const greaseS = (t, d, g, p = 0) => k.play('stroke', t, { material: 'chalk', dur: d, gain: g, pan: p });
    const slam = (t, g = 1) => { k.play('stamp', t, { gain: 0.9 * g }); k.play('press', t, { gain: 0.5 * g }); };
    k.bed('room', 0, D, { gain: 0.24 });
    // a clock ticks under the hook and the takeaway (the bullet frozen in time)
    k.withMinor(() => { for (let t = 0.0; t < wt(9); t += 0.5) k.play('tick', t, { f: 3200, gain: 0.5 }); for (let t = wt(68); t < D - 0.3; t += 0.5) k.play('tick', t, { f: 3200, gain: 0.5 }); });
    // caption slips: each word set like a slug of type
    CAPS.forEach((c, ci) => { for (let i = c[0]; i <= c[1]; i++) tap(wt(i) - 0.04, 0.7, 0); if (ci) k.play('paper', wt(c[0]) - 0.12, { dur: 0.12, gain: 0.25, minor: true }); c[3].forEach((wi) => greaseS(wt(wi), 0.22, 0.7)); });
    // hook
    k.play('impact', 0.02, { gain: 0.8 }); knock(0.04, 0.7);
    greaseS(wt(2), 0.35, 0.9);
    knock(wt(4), 0.9);
    // make it miss
    greaseS(wt(8), 0.18, 1.0); greaseS(wt(8) + 0.14, 0.18, 1.0);
    k.play('whoosh', wt(9), { dur: 0.55, top: 3200, gain: 0.9, pan: 0.4 }); rulePen(wt(9) + 0.05, 0.45, 1.0, 0.3);
    knock(wt(11), 0.8, 0.3);
    // spin to the alternate edition
    k.play('whoosh', SC.spin1[0], { dur: 0.35, gain: 0.8 }); k.play('paper', SC.spin1[0], { dur: SC.spin1[1] - SC.spin1[0], gain: 0.7 });
    k.play('slap', SC.spin1[1] - 0.02, { gain: 0.5 }); slam(wt(12) + 0.1, 1.1);
    // empires
    rustle(WORDS[15][1] + 0.1, 0.5, 1); slam(wt(16), 0.8);
    for (let i = 0; i < 4; i++) tap(wt(17) + i * 0.12, 0.9, (i % 2 ? 0.3 : -0.3));
    EMP.forEach((e, i) => { knock(e.t, 0.8, i % 2 ? 0.3 : -0.3); greaseS(e.t + 0.2, 0.22, 0.8, i % 2 ? 0.3 : -0.3); });
    for (let i = 0; i < 4; i++) greaseS(wt(26) + i * 0.07, 0.2, 0.7, i % 2 ? 0.3 : -0.3);
    // never happened
    rustle(wt(27) - 0.1, 0.8, 1);
    greaseS(wt(29), 0.3, 1.0); greaseS(wt(32), 0.3, 1.0);
    greaseS(wt(33), 0.2, 1.1); greaseS(wt(33) + 0.18, 0.2, 1.1); k.play('error', wt(33) + 0.4, { f: 'E3', gain: 0.6 });
    // darker: the lamp dims, a low swell
    k.play('riser', wt(35), { dur: 1.2, gain: 0.8 }); k.tone(wt(37), { f: [[0, 70], [1.2, 48]], dur: 1.6, gain: 0.25, a: 0.4 }); k.play('thud', WORDS[38][1], { f: 90, gain: 0.9 });
    // page turn
    k.play('paper', SC.turn[0], { dur: SC.turn[1] - SC.turn[0], gain: 0.9 });
    k.noise(SC.turn[0], { dur: SC.turn[1] - SC.turn[0] + 0.1, color: 'pink', filter: 'bandpass', f: [[0, 300], [(SC.turn[1] - SC.turn[0]) * 0.5, 1000], [SC.turn[1] - SC.turn[0] + 0.1, 280]], q: 0.7, gain: 0.32, a: 0.3 });
    k.play('slap', SC.turn[1] - 0.04, { gain: 0.35, pan: -0.4 });
    // Vienna
    knock(wt(47), 0.9); greaseS(wt(47) + 0.1, 0.35, 0.9);
    rustle(wt(51) - 0.9, 0.7, 1);
    slam(wt(52), 1.0); slam(wt(55), 1.1);
    // Poland, grandparents
    rustle(wt(59) - 0.75, 0.7, 1); knock(wt(59), 0.8);
    k.play('erase', wt(60), { dur: 0.7, gain: 0.8 }); slam(wt(61), 1.0);
    k.play('erase', wt(66), { dur: 0.75, gain: 0.7 });
    // spin back to the real paper
    k.play('whoosh', SC.spin2[0], { dur: 0.35, gain: 0.8 }); k.play('paper', SC.spin2[0], { dur: SC.spin2[1] - SC.spin2[0], gain: 0.7 }); k.play('slap', SC.spin2[1] - 0.02, { gain: 0.5 });
    // takeaway
    k.play('impact', wt(72), { gain: 1.0 }); greaseS(wt(72), 0.3, 1.0);
    k.play('ding', wt(73), { f: 'C5', gain: 0.4 }); k.play('ding', wt(76), { f: 'G4', gain: 0.4 });
    knock(D - 0.6, 0.6);
  }

  window.explainer = explainer; window.scoreSound = scoreSound; window.DURATION = DURATION; window.BEATS = BEATS;
})();

</script>
<script>
(() => {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d', { willReadFrequently: true });
  const D = window.DURATION, audio = document.getElementById('vo');
  let playing = false, soundOn = true, stopSound = null, clockT = 0, last = 0, useAudio = true;
  const draw = (t) => { window.explainer(ctx, 1080, 1920, Math.max(0, Math.min(D, t))); };
  window.seek = (t) => draw(t);
  const fmt = (t) => t.toFixed(2);
  const ui = (t) => { document.getElementById('scrub').value = Math.round(t / D * 1000); document.getElementById('time').textContent = fmt(t) + ' / ' + fmt(D); };
  const cur = () => useAudio ? audio.currentTime : clockT;
  const stopS = () => { if (stopSound) { stopSound(); stopSound = null; } };
  const startS = () => { stopS(); if (soundOn) stopSound = SOUND.live(window.scoreSound, cur(), { voiceover: true }); };
  const play = () => { playing = true; document.getElementById('play').textContent = 'Pause'; if (useAudio) { audio.currentTime = Math.min(cur(), D); audio.muted = !soundOn; audio.play().catch(() => { useAudio = false; }); } last = performance.now(); startS(); };
  const pause = () => { playing = false; document.getElementById('play').textContent = 'Play'; audio.pause(); stopS(); };
  const setT = (t) => { if (useAudio) audio.currentTime = t; clockT = t; draw(t); ui(t); if (playing) startS(); };
  document.getElementById('play').onclick = () => playing ? pause() : play();
  document.getElementById('scrub').oninput = (e) => setT(e.target.value / 1000 * D);
  document.getElementById('snd').onclick = (e) => { soundOn = !soundOn; e.target.textContent = 'Sound: ' + (soundOn ? 'on' : 'off'); audio.muted = !soundOn; if (!soundOn) stopS(); else if (playing) startS(); };
  const loadFile = (f) => { if (!f) return; audio.src = URL.createObjectURL(f); useAudio = true; pause(); setT(0); };
  document.getElementById('file').onchange = (e) => loadFile(e.target.files[0]);
  addEventListener('dragover', (e) => { e.preventDefault(); document.getElementById('drop').style.display = 'flex'; });
  addEventListener('dragleave', () => document.getElementById('drop').style.display = 'none');
  addEventListener('drop', (e) => { e.preventDefault(); document.getElementById('drop').style.display = 'none'; loadFile(e.dataTransfer.files[0]); });
  const tick = (now) => {
    if (playing) {
      if (useAudio) { if (audio.currentTime >= D - 0.02 || (audio.ended)) { audio.currentTime = 0; audio.play(); startS(); } }
      else { clockT += (now - last) / 1000; if (clockT >= D) { clockT = 0; startS(); } }
      last = now; const t = Math.min(cur(), D); draw(t); ui(t);
    }
    requestAnimationFrame(tick);
  };
  const specs = ['400 150px "UnifrakturMaguntia"', '700 100px "Oswald"', '400 20px "Oswald"', '400 16px "Libre Baskerville"', '700 16px "Libre Baskerville"', 'italic 400 16px "Libre Baskerville"', '800 100px "Playfair Display"', 'italic 400 60px "Playfair Display"', '400 40px "Playfair Display"'];
  window.ready = Promise.all(specs.map((s) => document.fonts.load(s, 'AaZz09’…'))).then(() => document.fonts.ready).then(() => { draw(0); ui(0); requestAnimationFrame(tick); return true; });
})();
